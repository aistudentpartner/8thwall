name: Windows standalone Traditional Chinese
on:
  push:
    branches: [feat/zh-tw-localization]
    paths:
      - 'apps/desktop/**'
      - 'reality/cloud/xrhome/**'
      - '.github/workflows/standalone-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build standalone application
        run: npm run standalone:setup --prefix apps/desktop
      - name: Test offline dependency handling
        run: npm run standalone:test --prefix apps/desktop
      - name: Package Windows installer
        working-directory: apps/desktop
        run: node node_modules/electron-builder/cli.js --config builder.standalone.cjs --win --x64 --publish never
      - name: Install and test packaged application without system Node or external web access
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $installer = (Get-ChildItem out/standalone/8thWall-TW-Setup-*-x64.exe | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP '8w-smoke-install'
          New-Item -ItemType Directory -Force out/standalone-smoke | Out-Null
          $setup = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue | Where-Object {$_.Id -in 1000,1001} | Format-List | Out-String | Tee-Object out/standalone-smoke/installer-error.txt
            throw "Installer failed: $($setup.ExitCode)"
          }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $app = Start-Process -FilePath (Join-Path $installDir '8thWall-Standalone-TW.exe') -ArgumentList '--standalone-smoke-test' -PassThru -RedirectStandardOutput out/standalone-smoke/stdout.log -RedirectStandardError out/standalone-smoke/stderr.log
          if (-not $app.WaitForExit(960000)) { $app.Kill(); throw 'Installed application test timed out' }
          Get-Content out/standalone-smoke/stdout.log
          Get-Content out/standalone-smoke/stderr.log
          if ($app.ExitCode -ne 0) { throw "Installed application failed: $($app.ExitCode)" }
          $result = Get-Content out/standalone-smoke/result.json | ConvertFrom-Json
          if (-not ($result.passed -and $result.packaged -and $result.modelImported -and $result.scenePersisted -and $result.previewRendered)) { throw 'Packaged test did not pass' }
      - uses: actions/upload-artifact@v4
        with:
          name: 8thWall-TW-Windows-x64
          path: apps/desktop/out/standalone/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-smoke-diagnostics
          path: apps/desktop/out/standalone-smoke/
          if-no-files-found: ignore
